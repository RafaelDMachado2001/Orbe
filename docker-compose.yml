name: verso-financas

x-php-common: &php-common
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: verso-financas/php:8.3
  user: "${UID:-1000}:${GID:-1000}"
  working_dir: /var/www/html
  volumes:
    - ./backend:/var/www/html
    - composer-cache:/var/www/.composer
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - verso

services:
  postgres:
    image: postgres:16-alpine
    container_name: verso-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-verso_financas}
      POSTGRES_USER: ${DB_USERNAME:-verso}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-verso} -d ${DB_DATABASE:-verso_financas}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - verso

  redis:
    image: redis:7-alpine
    container_name: verso-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_FORWARD_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - verso

  api:
    <<: *php-common
    container_name: verso-api
    environment:
      CONTAINER_ROLE: app

  queue:
    <<: *php-common
    container_name: verso-queue
    environment:
      CONTAINER_ROLE: queue
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  scheduler:
    <<: *php-common
    container_name: verso-scheduler
    environment:
      CONTAINER_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: verso-nginx
    ports:
      - "${API_FORWARD_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - verso

  web:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: verso-financas/node:22
    container_name: verso-web
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${WEB_FORWARD_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - node-modules:/app/node_modules
    networks:
      - verso

volumes:
  postgres-data:
  redis-data:
  composer-cache:
  node-modules:

networks:
  verso:
    driver: bridge
